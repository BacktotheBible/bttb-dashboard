<title>Zambia — SALT Scorecard</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F1EDE4;  --surface:#FBF9F4;  --surface_2:#F3EFE6;  --ink:#201D16;  --muted:#726A59;  --line:#E4DDD0;  --line_strong:#D6CCBA;  --accent:#3B5998;  --accent_2:#2D4373;  --accent_light:#7B9FD4;  --secondary:#1B7A7E;  --amber:#D4A574;  --amber_2:#A67C52;  --amber_soft:#F0E8DC;  --track:#E7E1D4;
}
:root[data-theme='dark']{
  --bg:#141109; --surface:#1E1A13; --surface-2:#241F17; --ink:#EEE9DE; --muted:#A79E8D;
  --line:#322B21; --line-strong:#463D2E; --accent:#6B92D4; --accent-2:#8FB4E0;
  --amber:#D69A3C; --amber-2:#E8B25A; --amber-soft:#3A2E19; --track:#2A2419;
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{width:100%; height:100%; background:var(--bg)}
body{display:flex; align-items:center; justify-content:center;
  font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink)}
#stage{width:1080px; height:1920px; flex:none; background:var(--bg);
  padding:50px 76px 40px; display:flex; flex-direction:column}
.eyebrow{font-size:24px; text-transform:uppercase; letter-spacing:.22em;
  color:var(--accent); font-weight:700}
h1{font-size:70px; line-height:.98; font-weight:800; margin:12px 0 30px}
.hero{background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:28px 32px; margin-bottom:40px; text-align:center}
.hero-num{font-size:80px; font-weight:800; color:var(--accent)}
.hero-label{font-size:18px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; margin-top:8px}
.dimensions{flex:1; display:flex; flex-direction:column; justify-content:space-around}
.dim{display:grid; grid-template-columns:250px 1fr 80px; align-items:center; gap:16px}
.dn{font-size:22px; font-weight:700}
.dv{display:flex; align-items:center; gap:12px}
.track{flex:1; height:24px; background:var(--track); border-radius:7px; overflow:hidden}
.fill{height:100%; background:var(--accent); border-radius:7px}
.num{font-size:26px; font-weight:800; color:var(--accent); width:60px; text-align:right}
</style>

<div id="stage">
  <div class="eyebrow">SALT Index · Zambia</div>
  <h1>Six Dimensions</h1>

  <div class="hero">
    <div class="hero-num">4.14</div>
    <div class="hero-label">Composite Score</div>
  </div>

  <div class="dimensions">
    <div class="dim">
      <div class="dn">Core Beliefs</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:88.22155650045096%"></div></div>
        <div class="num">4.53</div>
      </div>
    </div>
    <div class="dim">
      <div class="dn">Personal Faith Practice</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:82.89961713328546%"></div></div>
        <div class="num">4.32</div>
      </div>
    </div>
    <div class="dim">
      <div class="dn">Scripture Absorption</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:79.65242881072025%"></div></div>
        <div class="num">4.19</div>
      </div>
    </div>
    <div class="dim">
      <div class="dn">Life Transformation</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:82.79592406476827%"></div></div>
        <div class="num">4.31</div>
      </div>
    </div>
    <div class="dim">
      <div class="dn">Activation & Discipleship</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:69.91528153588455%"></div></div>
        <div class="num">3.80</div>
      </div>
    </div>
    <div class="dim">
      <div class="dn">Community Engagement</div>
      <div class="dv">
        <div class="track"><div class="fill" style="width:67.24455611390286%"></div></div>
        <div class="num">3.69</div>
      </div>
    </div>
  </div>
</div>

<script>(function(){
function fit(){const s=document.getElementById('stage');
  s.style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')';}
addEventListener('resize',fit); fit();
})();</script>
