<title>Zambia SALT — Touch Hub</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F1EDE4; --surface:#FBF9F4; --surface-2:#F3EFE6;
  --ink:#201D16; --muted:#726A59; --line:#E4DDD0;
  --line-strong:#D6CCBA; --accent:#3B5998;
  --accent-2:#2D4373; --secondary:#1B7A7E;
  --amber:#D4A574; --amber-2:#A67C52;
  --amber-soft:#F0E8DC; --track:#E7E1D4;
}
:root[data-theme="dark"]{
  --bg:#141109; --surface:#1E1A13; --surface-2:#241F17; --ink:#EEE9DE; --muted:#A79E8D;
  --line:#322B21; --line-strong:#463D2E; --accent:#6B92D4; --accent-2:#8FB4E0;
  --secondary:#5ABCC0; --amber:#D69A3C; --amber-2:#E8B25A; --amber-soft:#3A2E19;
  --track:#2A2419;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141109; --surface:#1E1A13; --surface-2:#241F17; --ink:#EEE9DE; --muted:#A79E8D;
  --line:#322B21; --line-strong:#463D2E; --accent:#6B92D4; --accent-2:#8FB4E0;
  --secondary:#5ABCC0; --amber:#D69A3C; --amber-2:#E8B25A; --amber-soft:#3A2E19;
  --track:#2A2419;
}}
*{box-sizing:border-box; margin:0; padding:0}
html,body{width:100%; height:100%; background:var(--bg); overflow:hidden}
body{display:flex; align-items:center; justify-content:center;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--ink)}
.mono{font-family:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
#stage{width:1080px; height:1920px; flex:none; background:var(--bg); position:relative;
  transform-origin:center center; display:flex; flex-direction:column; padding:40px;
  gap:20px}
.header{text-align:center}
.eyebrow{font-size:20px; text-transform:uppercase; letter-spacing:.2em;
  color:var(--accent); font-weight:700}
h1{font-size:60px; line-height:1; font-weight:800; margin:12px 0}
.subtitle{font-size:18px; color:var(--muted); margin-top:8px}
.composite{background:var(--surface); border:2px solid var(--accent);
  border-radius:20px; padding:32px; text-align:center}
.comp-value{font-size:72px; font-weight:800; color:var(--accent)}
.comp-label{font-size:18px; color:var(--muted); margin-top:8px; text-transform:uppercase;
  letter-spacing:.05em}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; flex:1;
  align-content:start}
.dimension{background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:24px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer; transition:all .2s}
.dimension:hover{border-color:var(--accent); transform:scale(1.02)}
.dimension:active{background:var(--surface-2)}
.dim-value{font-size:56px; font-weight:800; color:var(--accent)}
.dim-name{font-size:14px; color:var(--muted); margin-top:12px; text-align:center;
  text-transform:uppercase; letter-spacing:.05em; line-height:1.2}
.controls{display:flex; gap:12px; padding:20px; background:var(--surface);
  border-radius:16px; border:1px solid var(--line)}
.btn{flex:1; padding:14px; background:var(--accent); color:white;
  border:none; border-radius:10px; font-weight:700; cursor:pointer; font-size:16px;
  transition:all .2s}
.btn:hover{opacity:.9; transform:scale(1.02)}
.btn:active{transform:scale(.98)}
footer{font-size:14px; color:var(--muted); text-align:center}
</style>

<div id="stage">
  <div class="header">
    <div class="eyebrow">SALT Index · Zambia</div>
    <h1>Explore the Data</h1>
  </div>

  <div class="composite">
    <div class="comp-value">4.14</div>
    <div class="comp-label">Composite Score</div>
  </div>

  <div class="grid">
    <div class="dimension">
      <div class="dim-value">4.53</div>
      <div class="dim-name">Core Beliefs</div>
    </div>
    <div class="dimension">
      <div class="dim-value">4.32</div>
      <div class="dim-name">Personal Faith<br>Practice</div>
    </div>
    <div class="dimension">
      <div class="dim-value">4.19</div>
      <div class="dim-name">Scripture<br>Absorption</div>
    </div>
    <div class="dimension">
      <div class="dim-value">4.31</div>
      <div class="dim-name">Life<br>Transformation</div>
    </div>
    <div class="dimension">
      <div class="dim-value">3.80</div>
      <div class="dim-name">Activation &<br>Discipleship</div>
    </div>
    <div class="dimension">
      <div class="dim-value">3.69</div>
      <div class="dim-name">Community<br>Engagement</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn">1. Filter</button>
    <button class="btn">2. Tap a Topic</button>
  </div>

  <footer>n=1,195 respondents · Zambia SALT survey</footer>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const btns = document.querySelectorAll('.btn');
  const dims = document.querySelectorAll('.dimension');

  // Button interactions
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btn.style.opacity = '0.7';
      setTimeout(() => { btn.style.opacity = '1'; }, 100);
    });
  });

  // Dimension interactions
  dims.forEach(dim => {
    dim.addEventListener('click', () => {
      dim.style.transform = 'scale(0.95)';
      setTimeout(() => { dim.style.transform = ''; }, 100);
    });
  });

  // Responsive scaling
  function fit(){
    stage.style.transform = 'scale(' + Math.min(innerWidth/1080, innerHeight/1920) + ')';
  }
  addEventListener('resize', fit);
  fit();
})();
</script>
